<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NMB Haematology Lab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e3a8a); display: flex; justify-content: center; align-items: center; padding: 1rem; }
        .card { background: white; max-width: 450px; width: 100%; border-radius: 32px; padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.25); }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #0f172a; }
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 14px; }
        .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 40px; font-weight: bold; cursor: pointer; }
        .register-link { text-align: center; margin-top: 1rem; }
        .demo-note { background: #f1f5f9; padding: 12px; border-radius: 16px; margin-top: 1.5rem; font-size: 12px; }
    </style>
</head>
<body>
<div class="card">
    <h2><i class="fa-solid fa-microscope"></i> Lab Access</h2>
    <div class="input-group"><label>Email (Username)</label><input type="email" id="loginEmail" placeholder="email@example.com"></div>
    <div class="input-group"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
    <button class="btn" onclick="doLogin()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Login</button>
    <div class="register-link"><a href="register.html">New patient? Register here</a></div>
    <div class="demo-note"><strong>Demo Credentials:</strong><br>Manager: manager@lab.co.za / Manager@123<br>Technician: bongiwe@hemalab.co.za / Tech@1234<br>Doctor:  luthogodongwana@gmail.com / Doctor@123<br>Patient: kamva@example.com / Patient@123<br>Admin: admin@system.com / Admin@123</div>
</div>
<script>
    const USERS = [
        { email: "manager@lab.co.za", password: "Manager@123", role: "Laboratory Manager", name: "Lab Manager", redirect: "Laboratory Manager Subsystem.html" },
        { email: "bongiwe@hemalab.co.za", password: "Tech@1234", role: "Lab Technician", name: "Bongiwe Mabasa", redirect: "Lab Technician Subsystem.html" },
        { email: "luthogodongwana@gmail.com", password: "Doctor@123", role: "Doctor", name: "Dr. Lutho Godongwana", redirect: "Doctor.html" },
        { email: "kamva@example.com", password: "Patient@123", role: "Patient", name: "Kamva Ndebelefele", redirect: "Patient Subsystem.html" },
        { email: "admin@system.com", password: "Admin@123", role: "Admin", name: "Admin User", redirect: "Admin Subsystem.html" }
    ];
    function doLogin() {
        let email = document.getElementById("loginEmail").value.trim();
        let pwd = document.getElementById("loginPassword").value;
        let user = USERS.find(u => u.email === email && u.password === pwd);
        if (user) {
            localStorage.setItem("currentUser", JSON.stringify({ email: user.email, role: user.role, fullName: user.name, avatar: user.name.charAt(0) }));
            alert("Welcome " + user.name);
            location.href = user.redirect;
        } else {
            // check registered patients
            let patients = JSON.parse(localStorage.getItem("registeredPatients") || "[]");
            let patient = patients.find(p => p.email === email && atob(p.passwordHash) === pwd);
            if (patient) {
                localStorage.setItem("currentUser", JSON.stringify({ email: patient.email, role: "Patient", fullName: patient.name + " " + patient.surname, avatar: patient.name.charAt(0) }));
                location.href = "Patient Subsystem.html";
            } else {
                alert("Invalid credentials");
            }
        }
    }
</script>
</body>
</html>
